# Frontend production deployment (docs/ci-cd.md). Manual only; the deploy job
# waits for the owner's approval on the "production" environment.
#
#   Release:  Run workflow, ref = a commit on main (blank = current main).
#   Rollback: Run workflow, rollback_run_id = the ID of an earlier successful
#             run of this workflow; its exact site artifact is redeployed.
#
# The build job has no AWS access. It builds from the public production Guide
# API, so the release contains exactly the content production serves. The
# deploy job assumes a role (GitHub OIDC, no stored keys) that can only write
# the site bucket, update/test/publish the viewer-request function and
# invalidate this distribution; it runs the existing deploy script
# (scripts/edge/deploy-site.mjs) and then verifies the public site.
name: Deploy production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA on main to release (blank = current main). Ignored for a rollback."
        required: false
        default: ""
      rollback_run_id:
        description: "Rollback only: run ID of an earlier successful 'Deploy production' run to redeploy."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: production-frontend
  cancel-in-progress: false

env:
  PUBLIC_ORIGIN: https://lifeinuk.info
  API_BASE: https://lifeinuk.info
  ARTIFACT: production-site

jobs:
  build:
    name: Build and validate the release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # download an earlier run's artifact for a rollback
    outputs:
      sha: ${{ steps.result.outputs.sha }}
      artifact_run_id: ${{ steps.result.outputs.artifact_run_id }}
    steps:
      - name: Check inputs
        env:
          REF: ${{ inputs.ref }}
          ROLLBACK: ${{ inputs.rollback_run_id }}
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::run this workflow from main"; exit 1; }
          [ -z "$REF" ] || [[ "$REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::ref must be a full 40-character commit SHA"; exit 1; }
          [ -z "$ROLLBACK" ] || [[ "$ROLLBACK" =~ ^[0-9]+$ ]] || { echo "::error::rollback_run_id must be a run ID"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select the release commit
        if: inputs.rollback_run_id == ''
        env:
          REF: ${{ inputs.ref }}
        run: |
          sha=${REF:-$(git rev-parse origin/main)}
          git merge-base --is-ancestor "$sha" origin/main || { echo "::error::$sha is not on main"; exit 1; }
          git checkout --quiet --detach "$sha"
          echo "Release commit: $sha"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.rollback_run_id == ''
        with:
          node-version: 22
          cache: npm

      - name: Install, lint, test
        if: inputs.rollback_run_id == ''
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm test

      - name: Release build from the production Guide API
        if: inputs.rollback_run_id == ''
        run: |
          npm run build:release
          node scripts/ci/check-release-output.mjs --expect-api "$API_BASE"

      - name: Keep the release for deployment and later rollback
        if: inputs.rollback_run_id == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            dist/
            release/build.json
          if-no-files-found: error
          retention-days: 90

      # Only an artifact made by this workflow's own build job on main may be redeployed: any
      # other run (CI, a pull request from a fork, another branch) could upload an artifact with
      # the same name and a forged release/build.json.
      - name: Check the rollback run
        if: inputs.rollback_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLBACK: ${{ inputs.rollback_run_id }}
        run: |
          workflow=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-production.yml" --jq .id)
          IFS=$'\t' read -r id event branch conclusion repo < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ROLLBACK" \
            --jq '[.workflow_id, .event, .head_branch, .conclusion, .head_repository.full_name] | @tsv')
          if [ "$id" != "$workflow" ] || [ "$event" != workflow_dispatch ] || [ "$branch" != main ] \
             || [ "$conclusion" != success ] || [ "$repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::run $ROLLBACK is not a successful 'Deploy production' run on main of this repository (workflow $id, $event, $branch, $conclusion, $repo)"
            exit 1
          fi
          echo "Rollback source: run $ROLLBACK (Deploy production, main, success)"

      - name: Fetch the rollback release
        if: inputs.rollback_run_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ARTIFACT }}
          run-id: ${{ inputs.rollback_run_id }}
          github-token: ${{ github.token }}
          path: .

      - name: Result
        id: result
        env:
          ROLLBACK: ${{ inputs.rollback_run_id }}
        run: |
          sha=$(node -p 'require("./release/build.json").commit')
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::release/build.json has no commit"; exit 1; }
          git merge-base --is-ancestor "$sha" origin/main || { echo "::error::$sha is not on main"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "artifact_run_id=${ROLLBACK:-$GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          {
            echo "### ${ROLLBACK:+Rollback }release ready"
            echo "Commit \`$sha\`, artifact from run ${ROLLBACK:-$GITHUB_RUN_ID}"
            node -p 'const m = require("./release/build.json"); [m.pages, "canonical pages,", m.redirects, "redirects, built", m.builtAt, "from", m.apiBase].join(" ")'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to S3 + CloudFront and verify
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://lifeinuk.info
    permissions:
      contents: read
      actions: read
      id-token: write # GitHub OIDC → AWS role; no stored AWS keys
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install (locked)
        run: npm ci --no-audit --no-fund

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ARTIFACT }}
          run-id: ${{ needs.build.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: .

      - name: Re-check the release before any AWS access
        run: |
          node scripts/ci/check-release-output.mjs --expect-api "$API_BASE"
          node scripts/edge/deploy-site.mjs --bucket "$SITE_BUCKET" --distribution "$DISTRIBUTION" --function "$FUNCTION" | tail -n 3
        env:
          SITE_BUCKET: ${{ vars.SITE_BUCKET }}
          DISTRIBUTION: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          FUNCTION: ${{ vars.CLOUDFRONT_FUNCTION_NAME }}

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_FRONTEND_DEPLOY_ROLE_ARN }}
          role-session-name: lifeinuk-frontend-${{ github.run_id }}
          aws-region: eu-west-2
          role-duration-seconds: 1800

      - name: Deploy (upload, function test + publish, stale objects, invalidation)
        env:
          SITE_BUCKET: ${{ vars.SITE_BUCKET }}
          DISTRIBUTION: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          FUNCTION: ${{ vars.CLOUDFRONT_FUNCTION_NAME }}
        run: node scripts/edge/deploy-site.mjs --bucket "$SITE_BUCKET" --distribution "$DISTRIBUTION" --function "$FUNCTION" --execute

      - name: Verify the public site
        # The function and invalidation take a minute or two to reach every edge.
        run: |
          for attempt in 1 2 3 4; do
            if node scripts/edge/verify-site.mjs --base "$PUBLIC_ORIGIN" --production > verify.log 2>&1; then
              grep -v '^… ' verify.log; exit 0
            fi
            echo "attempt $attempt: $(grep -c '^  - ' verify.log || true) failure(s)"; [ "$attempt" = 4 ] || sleep 60
          done
          grep -v '^… ' verify.log; exit 1

      - name: Report
        if: always()
        env:
          SHA: ${{ needs.build.outputs.sha }}
          ARTIFACT_RUN: ${{ needs.build.outputs.artifact_run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### Frontend production deploy: $JOB_STATUS"
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`$SHA\` |"
            echo "| Site artifact | run $ARTIFACT_RUN (redeploy with rollback_run_id=$ARTIFACT_RUN) |"
            echo "| Site | $PUBLIC_ORIGIN |"
            echo
            if [ -f verify.log ]; then echo '```'; grep -v '^… ' verify.log | tail -n 30; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"
